name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      approve_deployment:
        description: 'I approve deploying main to jwt.rigilgilbert.com'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jwt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_deployment == true &&
      github.actor == 'rigilg' &&
      github.triggering_actor == 'rigilg'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jwt.rigilgilbert.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=rigil-jwt --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc9c92fe89832c34095421675a18d7db
